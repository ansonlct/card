<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f8f4">
<meta name="description" content="極簡英文 Flashcards，附中文解釋、例句、個人句子及不同場合 JSON 情境檔。">
<title>Wordwell — Vocabulary Card</title>
<style>

:root{--ink:#15362f;--deep:#173b33;--muted:#7b8d80;--line:#dfe7df;--lime:#cffa83;--bg:#f6f8f3;--shadow:0 18px 48px rgba(25,63,46,.11)}
*{box-sizing:border-box}
html{min-height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100svh;color:var(--ink);background:radial-gradient(ellipse at 52% -15%,#e5efdf 0,transparent 62%),var(--bg);font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body.panel-open{overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.48;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid #8fbda1;outline-offset:3px}
.shell{width:min(calc(100% - 38px),680px);margin:0 auto;padding:29px 0 24px}
.masthead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:23px}
.mark{font-size:25px;font-weight:900;letter-spacing:-1.5px;line-height:1.1}.mark b{color:#8db976}
.mastnote{font-size:9px;letter-spacing:1.9px;color:#91a695;font-weight:850;white-space:nowrap}
.search-row{display:flex;gap:11px;align-items:stretch;margin-bottom:16px}
.search-field{display:flex;align-items:center;gap:11px;flex:1;min-width:0;height:56px;padding:0 18px;background:#fff;border:1px solid #dce6dc;border-radius:17px;box-shadow:0 6px 23px #183e3008}
.search-field:focus-within{border-color:#a6cd9c;box-shadow:0 0 0 4px #c2dfb341}
.search-icon{color:#8aa496;flex:none}
.search-field input{background:transparent;border:0;outline:0;min-width:0;width:100%;font-size:16px;color:var(--ink)}
.search-field input::placeholder{color:#94a498}
.random-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 19px;min-width:145px;border-radius:16px;font-size:13px;font-weight:850;white-space:nowrap;background:var(--ink);color:white;box-shadow:0 10px 19px #18372f12;transition:background .16s,transform .16s}
.random-btn:hover{background:#285b45;transform:translateY(-1px)}
.random-btn svg{height:18px;width:18px;flex:none}
.card-perspective{position:relative;height:var(--card-measured-height,430px);perspective:1450px;isolation:isolate}
.card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .52s cubic-bezier(.2,.7,.2,1)}
.card-perspective.flipped .card-inner{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:25px;box-shadow:var(--shadow)}
.card-front{display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:29px 34px;background:radial-gradient(ellipse at 100% 2%,#315f4b 0,transparent 66%),linear-gradient(130deg,#21473e,#112d29 90%);color:white;cursor:pointer;isolation:isolate}
.card-front:after{content:"";position:absolute;width:260px;height:260px;border:1px solid #ffffff18;border-radius:50%;right:-116px;bottom:-162px;box-shadow:0 0 0 63px #ffffff06,0 0 0 124px #ffffff03;pointer-events:none;z-index:-1}
.card-back{display:flex;flex-direction:column;padding:27px 32px 24px;background:#fff;color:var(--ink);transform:rotateY(180deg);cursor:pointer}
.card-top,.back-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
.card-kicker{display:inline-flex;align-items:center;gap:8px;font-size:10px;font-weight:850;letter-spacing:1.5px;color:#c0e2c9;white-space:nowrap}
.card-kicker:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime);flex:none}
.badge-set{display:flex;align-items:center;gap:8px;min-width:0}
.badge{display:inline-block;max-width:115px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid #ffffff35;color:#e4eddf;padding:6px 10px;border-radius:9px;font-size:10px;font-weight:700}
.sound-btn{display:inline-grid;place-items:center;flex:none;width:36px;height:36px;border-radius:50%;background:#ffffff18;color:#efffec;border:1px solid #ffffff27}
.sound-btn:hover{background:#ffffff30}
.sound-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.front-body{margin:auto 0;padding:15px 0;min-height:0;flex:0 1 auto}
.card-eyebrow{font-size:10px;letter-spacing:1.7px;color:#a8cbb4;font-weight:800;margin-bottom:13px}
.big-word{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(46px,7.8vw,71px);line-height:1.12;letter-spacing:-1.4px;overflow-wrap:anywhere}
.big-word.sentence{font-size:clamp(28px,4.8vw,43px);line-height:1.28;letter-spacing:-.6px}
.big-word.sentence.extended{font-size:clamp(21px,3vw,29px);line-height:1.35}
.phonetic-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:13px 0 0;color:#c5dbc8;font-size:13px}
.pos-pill{font-size:10px;background:#ffffff25;border-radius:8px;padding:4px 8px;color:#e7f4e9}
.card-footer{border-top:1px solid #ffffff2b;padding-top:15px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#b1cbb8;font-size:11px;flex:none}
.card-footer .corner{display:grid;place-items:center;width:28px;height:28px;border:1px solid #ffffff44;border-radius:50%;font-size:16px}
.back-head{margin-bottom:20px}
.back-head .card-kicker{color:#658d74}
.back-head .card-kicker:before{background:#9bbf8b}
.back-head .sound-btn{background:#edf5eb;color:#467052;border:0;width:33px;height:33px}
.label{font-size:9px;font-weight:850;letter-spacing:1.4px;color:#92a594;margin:0 0 7px}
.back-meaning{font-size:clamp(22px,3.5vw,29px);line-height:1.32;font-weight:800;letter-spacing:-.55px;margin:0;overflow-wrap:anywhere}
.back-definition{font-size:12px;color:#829482;line-height:1.55;margin:7px 0 0}
.divider{height:1px;background:#e6eee6;margin:14px 0 13px;flex:none}
.back-example{font-family:Georgia,"Times New Roman",serif;font-size:clamp(17px,2.8vw,21px);line-height:1.38;margin:4px 0 7px;overflow-wrap:anywhere;color:#315549}
.back-example strong{color:#3a7150;background:#e7f4db;border-radius:3px;padding:0 2px}
.back-translation{color:#7e9485;font-size:12px;line-height:1.5;margin:0}
.back-note{font-size:12px;line-height:1.6;color:#687e70;margin:12px 0}
.usage-link{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;padding:8px 0 4px;margin:4px 0 2px;background:transparent;color:#4e8b61;font-size:11px;font-weight:800}
.usage-link:hover{text-decoration:underline}
.back-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:13px}
.grade{border-radius:10px;font-size:12px;font-weight:850;padding:11px 13px;background:#edf5eb;color:#486950}
.grade.known{background:var(--ink);color:white}
.grade:hover{filter:brightness(.95)}
.flip-back{background:none;font-size:11px;color:#7b9786;padding:9px 4px}
.back-empty{text-align:center;margin:auto 0;padding:20px 2px}
.back-empty h2{font-size:23px;margin:0 0 12px}
.back-empty p{color:var(--muted);font-size:13px;line-height:1.75}
.tiny{font-size:11px;color:#94a398;line-height:1.6;margin:8px 0 0}
.tools-trigger{width:100%;min-height:60px;display:flex;align-items:center;gap:13px;padding:10px 14px;margin-top:16px;text-align:left;border:1px solid #dfe8df;border-radius:16px;background:#ffffffdb;box-shadow:0 6px 22px #1a402d08;color:var(--ink);transition:border-color .2s,transform .2s}
.tools-trigger:hover{transform:translateY(-1px);border-color:#b8d5b9}
.trigger-icon{width:39px;height:39px;flex:none;display:grid;place-items:center;border-radius:12px;background:#eaf4e7;color:#49765b}
.trigger-icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.trigger-title{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}.trigger-title strong{font-size:13px;font-weight:850}.trigger-title small{font-size:11px;font-weight:500;color:#91a396;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trigger-arrow{display:grid;place-items:center;flex:none;width:30px;height:30px;border:1px solid #e5eee4;border-radius:50%;color:#789d7b;font-size:15px}
.sheet-backdrop{position:fixed;z-index:35;inset:0;background:#0d2d26a9;backdrop-filter:blur(4px)}
.tools-panel{position:fixed;z-index:40;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,620px);height:auto;max-height:min(89svh,830px);display:flex;flex-direction:column;border-radius:28px 28px 0 0;background:#f8faf6;box-shadow:0 0 75px #09251f39;overflow:hidden}
.tools-panel:before{content:"";position:absolute;top:9px;left:calc(50% - 20px);width:40px;height:4px;border-radius:99px;background:#d3dfd4}
.tools-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:30px 24px 20px;background:linear-gradient(135deg,#e7f0e3,#f8faf6);border-bottom:1px solid #e1eadf;flex:none}
.tool-overline{font-size:10px;letter-spacing:1.6px;color:#7c9f81;font-weight:900;margin:0 0 6px}
.tools-head h2{font-size:23px;letter-spacing:-.7px;margin:0 0 5px}
.tools-head p:last-child{margin:0;font-size:12px;line-height:1.6;color:#809282}
.panel-close{width:38px;height:38px;flex:none;display:grid;place-items:center;background:white;color:#577361;border:1px solid #deeadc;border-radius:12px;font-size:24px}
.tools-scroll{overflow-y:auto;overscroll-behavior:contain;min-height:0;padding:8px 23px max(26px,env(safe-area-inset-bottom))}
.tool-section{padding:20px 0}.tool-section+.tool-section{border-top:1px solid #e2eae1}
.section-header{display:flex;gap:10px;align-items:center;margin-bottom:13px}
.section-icon{width:34px;height:34px;display:grid;place-items:center;flex:none;border-radius:11px;background:#eaf2e5;color:#4a7558;font-size:16px}
.section-title{margin:0;font-weight:850;font-size:14px}.section-subtitle{font-size:11px;color:#87988a;margin:3px 0 0}
.form-line{display:flex;flex-wrap:wrap;gap:9px}.form-line>*{min-width:0}
.tool-input,.tool-select{height:45px;min-width:160px;flex:1;padding:0 13px;border:1px solid #dae4da;border-radius:11px;background:#fff;font-size:13px;color:var(--ink)}
.tool-btn{display:inline-flex;justify-content:center;align-items:center;gap:7px;min-height:45px;padding:11px 13px;border-radius:11px;background:#e7f1e4;color:#446c4b;font-size:12px;font-weight:800;white-space:normal;text-align:center}
.tool-btn:hover{background:#dcebd7}.tool-btn.primary{background:var(--ink);color:#fff}.tool-btn.outline{background:white;border:1px solid #dbe6dd}.tool-btn.danger{color:#b05f52;background:#fbebe8}
.tool-copy{font-size:11px;line-height:1.7;color:#8b9a8d;margin:10px 0 0}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tool-grid .tool-btn{min-height:60px;display:flex;justify-content:flex-start;text-align:left;background:white;border:1px solid #deeadc;padding:11px 12px}
.tool-grid .tool-btn:hover{background:#eef6ea}
.tool-grid .tool-btn:last-child{grid-column:span 2;background:#e9f4e6;border-color:#e4efdc}
.tool-btn .tile-icon{flex:none;display:grid;place-items:center;width:33px;height:33px;border-radius:10px;background:#edf4e9;color:#517556;font-size:17px;font-weight:600}
.tool-btn .tile-txt{display:flex;flex-direction:column;gap:3px;line-height:1.25}
.tool-btn .tile-txt small{font-size:10px;color:#8da18c;font-weight:500}
.footmark{margin:14px 0 0;text-align:center;font-size:10px;letter-spacing:.3px;color:#a2b3a4}
.modal-cover{position:fixed;z-index:60;inset:0;background:#0b2925b8;display:none;align-items:center;justify-content:center;padding:18px}
.modal-cover.open{display:flex}
.modal{border-radius:22px;background:white;width:min(100%,570px);max-height:min(92svh,830px);overflow-y:auto;padding:24px 25px;box-shadow:0 30px 100px #10291e45}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-head h2{margin:0;font-size:20px}
.close{width:36px;height:36px;flex:none;border-radius:10px;font-size:23px;background:#f0f4ef;color:#637567}
.form-field{margin-top:15px}.form-field label{display:block;font-size:12px;font-weight:750;margin-bottom:7px}.form-field label i{font-style:normal;color:#b96a51}
.form-field input,.form-field textarea{width:100%;background:#fbfcfa;border:1px solid #dfe8df;border-radius:11px;padding:12px 13px;font-size:14px;color:var(--ink)}
.form-field textarea{min-height:78px;resize:vertical}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.modal-actions button{padding:11px 16px;border-radius:10px;font-weight:750;font-size:12px}
.modal-save{background:var(--ink);color:white}.modal-cancel{background:#edf1eb;color:#486851}.modal-delete{background:#fbeae5;color:#aa5d4d;margin-right:auto}
.usage-content{margin-top:16px;color:#3b5b49;font-size:14px;line-height:1.65}
.usage-content .taglist{display:flex;gap:8px;flex-wrap:wrap}.usage-tag{padding:7px 10px;border-radius:8px;font-size:12px;background:#eef5e9;color:#457658;font-weight:750}
.usage-content h3{font-size:12px;letter-spacing:1px;color:#8fa394;margin:16px 0 7px}
.usage-content p{margin:0;overflow-wrap:anywhere}
.toast{position:fixed;z-index:100;left:50%;bottom:24px;transform:translate(-50%,10px);max-width:min(90vw,620px);padding:13px 20px;border-radius:12px;background:#183c35;color:white;font-size:13px;line-height:1.6;text-align:center;box-shadow:0 14px 34px #112d2428;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.visible{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){
 .shell{width:calc(100% - 30px);padding:20px 0 16px}
 .masthead{margin-bottom:17px}.mark{font-size:24px}.mastnote{font-size:8px;letter-spacing:1px}
 .search-row{gap:8px;margin-bottom:13px}
 .search-field{height:50px;padding:0 13px;gap:9px;border-radius:13px}.search-field input{font-size:16px}.search-icon{height:18px;width:18px}
 .random-btn{min-width:115px;padding:0 11px;gap:5px;font-size:12px;border-radius:13px}.random-btn svg{height:16px;width:16px}
 .card-perspective{height:var(--card-measured-height,clamp(334px,47svh,404px))}
 .card-face{border-radius:20px}
 .card-front{padding:24px 23px}.card-back{padding:21px 22px 20px}
 .card-kicker{font-size:9px;letter-spacing:1.05px;gap:6px}.badge{font-size:9px;padding:6px 8px;max-width:84px}
 .sound-btn{height:33px;width:33px}
 .front-body{padding:13px 0}.card-eyebrow{font-size:9px;margin-bottom:11px}
 .big-word{font-size:clamp(41px,12vw,59px)}.big-word.sentence{font-size:clamp(25px,7.3vw,34px)}.big-word.sentence.extended{font-size:clamp(19px,5.8vw,25px)}
 .phonetic-row{font-size:12px;margin-top:12px}.card-footer{padding-top:13px;font-size:10px}
 .back-head{margin-bottom:13px}.back-meaning{font-size:clamp(21px,6vw,25px)}.divider{margin:12px 0}.back-example{font-size:clamp(16px,4.6vw,19px);line-height:1.35}.back-translation{font-size:11px;line-height:1.45}.back-actions{padding-top:10px;gap:7px}.grade{font-size:11px;padding:10px 11px}.usage-link{font-size:10px;margin:2px 0 0}
 .tools-trigger{min-height:56px;margin-top:13px;border-radius:14px}.trigger-icon{width:36px;height:36px}.trigger-title strong{font-size:12px}.trigger-title small{font-size:10px}
 .tools-panel{max-height:93svh;border-radius:25px 25px 0 0}.tools-head{padding:29px 18px 16px}.tools-scroll{padding:3px 18px max(25px,env(safe-area-inset-bottom))}.tool-section{padding:17px 0}.tool-grid .tool-btn{font-size:11px}.tool-btn .tile-txt small{font-size:9px}.form-line>.tool-select,.form-line>.tool-input{min-width:0}
 .footmark{margin-top:11px;font-size:9px}
 .modal{padding:20px 18px}.modal-actions button{padding:10px 12px}
}
@media(max-width:370px){.mastnote{display:none}.random-btn{min-width:108px;font-size:11px}.card-front{padding:21px 19px}.card-back{padding:18px}.back-actions .grade{font-size:10px;padding:9px 10px}}
@media(max-height:700px) and (max-width:600px){.shell{padding-top:13px}.masthead{margin-bottom:12px}.search-row{margin-bottom:10px}.card-perspective{height:var(--card-measured-height,clamp(300px,46svh,355px))}.tools-trigger{margin-top:10px}.footmark{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="shell">
  <header class="masthead"><div class="mark">wordwell<b>.</b></div><div class="mastnote">LESS SCROLL, MORE REMEMBERING</div></header>
  <div class="search-row">
    <label class="search-field" for="searchInput">
      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="7.3"/><path d="m16.2 16.2 5 5"/></svg>
      <input id="searchInput" type="search" placeholder="輸入英文單字或句子…" autocomplete="off" spellcheck="false" aria-label="搜尋英文生字或個人句子">
    </label>
    <button class="random-btn" id="randomBtn" type="button" title="隨機顯示下一張卡片">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3c5 0 5 10 10 10h3m0 0-3-3m3 3-3 3M4 17h3c2 0 4-2 5-5m1-4c1-1 2-1 4-1h3m0 0-3-3m3 3-3 3"/></svg>
      <span>隨機下一張</span>
    </button>
  </div>
  <section class="card-perspective" id="vocabCard" tabindex="0" aria-label="Vocabulary Card，點擊或按空白鍵翻面" aria-pressed="false">
    <div class="card-inner">
      <article class="card-face card-front" id="cardFront"></article>
      <article class="card-face card-back" id="cardBack"></article>
    </div>
  </section>
  <button class="tools-trigger" id="toolsTrigger" type="button" aria-haspopup="dialog" aria-controls="toolsPanel" aria-expanded="false">
    <span class="trigger-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M10 2h4l.7 2.3a8 8 0 0 1 1.9 1.1L19 4.7l2 3.5-1.7 1.7a9 9 0 0 1 0 2.2l1.7 1.7-2 3.5-2.4-.7a8 8 0 0 1-1.9 1.1L14 20h-4l-.7-2.3a8 8 0 0 1-1.9-1.1l-2.4.7-2-3.5 1.7-1.7a9 9 0 0 1 0-2.2L3 8.2l2-3.5 2.4.7a8 8 0 0 1 1.9-1.1L10 2Z" transform="translate(0 1) scale(1 .91)"/></svg></span>
    <span class="trigger-title"><strong>工具及場合</strong><small><span id="activeSceneLabel">我的學習</span> · 句子與備份管理</small></span>
    <span class="trigger-arrow" aria-hidden="true">↗</span>
  </button>
</main>
<div class="sheet-backdrop" id="toolsBackdrop" hidden></div>
<aside class="tools-panel" id="toolsPanel" role="dialog" aria-modal="true" aria-labelledby="toolsTitle" hidden>
  <header class="tools-head">
    <div><p class="tool-overline">YOUR STUDY SPACE</p><h2 id="toolsTitle">工具及場合</h2><p>按你的學習場景整理卡片，隨時備份。</p></div>
    <button class="panel-close" id="closeToolsBtn" type="button" aria-label="關閉工具面板">×</button>
  </header>
  <div class="tools-scroll">
    <section class="tool-section">
      <div class="section-header"><span class="section-icon">◈</span><div><h3 class="section-title">學習場合</h3><p class="section-subtitle">旅行、工作、日常對話都可分開記錄</p></div></div>
      <div class="form-line"><select class="tool-select" id="sceneSelect" aria-label="切換場合"></select><button class="tool-btn danger" id="deleteSceneBtn" type="button">刪除</button></div>
      <div class="form-line" style="margin-top:9px"><input class="tool-input" id="sceneNameInput" maxlength="65" placeholder="新增場合，例如：旅行、工作"><button class="tool-btn primary" id="createSceneBtn" type="button">＋ 建立場合</button></div>
      <p class="tool-copy">不同場合的個人句子及學習進度互相獨立；每個場合可匯出成一個 JSON 檔案。</p>
    </section>
    <section class="tool-section">
      <div class="section-header"><span class="section-icon">✎</span><div><h3 class="section-title">個人句子</h3><p class="section-subtitle">記錄你在不同場合想練習的說法</p></div></div>

function openTools(){const panel=$('toolsPanel');panel.hidden=false;$('toolsBackdrop').hidden=false;document.body.classList.add('panel-open');$('toolsTrigger').setAttribute('aria-expanded','true');$('closeToolsBtn').focus();}
function closeTools(){if($('toolsPanel').hidden)return;$('toolsPanel').hidden=true;$('toolsBackdrop').hidden=true;document.body.classList.remove('panel-open');$('toolsTrigger').setAttribute('aria-expanded','false');$('toolsTrigger').focus();}
function openUsage(){const card=current();if(!card)return;const parts=[];if(card.definition)parts.push(`<h3>英文解釋</h3><p>${esc(card.definition)}</p>`);if((card.collocations||[]).length)parts.push(`<h3>常見搭配</h3><div class="taglist">${card.collocations.map(x=>`<span class="usage-tag">${esc(x)}</span>`).join('')}</div>`);if(card.note)parts.push(`<h3>文法／用法提醒</h3><p>${esc(card.note)}</p>`);$('usageContent').innerHTML=parts.join('')||'<p>暫時沒有額外用法資料。</p>';$('usageTitle').textContent=card.word.length>45?'更多用法與搭配':`用法 · ${card.word}`;$('usageModal').classList.add('open');$('usageModal').setAttribute('aria-hidden','false');$('closeUsage').focus();}
function closeUsage(){$('usageModal').classList.remove('open');$('usageModal').setAttribute('aria-hidden','true');$('vocabCard').focus();}
function chooseRandom(){const deck=inScope();$('searchInput').value='';searchTerm='';flipped=false;
 if(deck.length===0){currentId=null;render();return;}
 if(deck.length===1){currentId=deck[0].id;render();return;}
 let index=Math.floor(Math.random()*(deck.length-1));const currentIndex=deck.findIndex(c=>c.id===currentId);if(currentIndex>=0&&index>=currentIndex)index++;currentId=deck[index].id;render();
}
function findSearch(raw){searchTerm=raw;const term=raw.trim().toLocaleLowerCase();if(!term){if(!current())chooseRandom();else render();return;}
 const deck=inScope();let card=deck.find(c=>c.word.toLocaleLowerCase()===term)||deck.find(c=>c.word.toLocaleLowerCase().startsWith(term))||deck.find(c=>[c.word,c.meaning,c.example,c.translation,c.note].some(t=>String(t||'').toLocaleLowerCase().includes(term)));
 currentId=card?.id||null;flipped=false;render();
}
function flip(){if(flipped){flipped=false;render();return;}flipped=true;const c=current();if(c){const sc=scene();const prev=sc.progress[c.id]||{};sc.progress[c.id]={...prev,count:(prev.count||0)+1,lastReviewed:Date.now(),level:prev.level||0};persist();}render();}
function grade(known){const c=current();if(c){const sc=scene();const prev=sc.progress[c.id]||{};sc.progress[c.id]={...prev,level:known?Math.min(5,(prev.level||0)+1):0,due:Date.now()+(known?[0,1,3,7,14,30][Math.min(5,(prev.level||0)+1)]*86400000:60000),lastReviewed:Date.now(),count:prev.count||1};persist();}chooseRandom();}
function speak(text){if(!text)return;try{if(!('speechSynthesis'in window))throw Error('not supported');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.87;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'))||null;speechSynthesis.speak(u);}catch{toast('這個瀏覽器不支援英文發音。');}}
function changeScene(id){if(!data.scenes.some(s=>s.id===id))return;data.activeSceneId=id;currentId=null;flipped=false;searchTerm='';$('searchInput').value='';invalidate();persist();chooseRandom();}
function createScene(){const name=$('sceneNameInput').value.trim();if(!name){toast('請先輸入場合名稱。');return;}const sc=newScene(name);data.scenes.push(sc);$('sceneNameInput').value='';persist();changeScene(sc.id);toast(`已建立「${name}」情境，可加入專屬個人句子。`);}
function deleteScene(){if(data.scenes.length<2)return;const sc=scene();if(!confirm(`確定刪除場合「${sc.name}」？其個人句子和進度會被刪除，建議先匯出 JSON。`))return;data.scenes=data.scenes.filter(s=>s.id!==sc.id);persist();changeScene(data.scenes[0].id);toast('已刪除場合。');}
function openEditor(card=null,prefill=''){closeTools();editId=card?.id||null;$('editorTitle').textContent=card?'編輯個人句子':'新增個人句子';$('personalEnglish').value=card?.word||prefill;$('personalMeaning').value=card?.meaning||'';$('personalExample').value=card?.example||'';$('personalTranslation').value=card?.translation||'';$('personalNote').value=card?.note||'';$('deletePersonalBtn').hidden=!card;$('editorModal').classList.add('open');$('editorModal').setAttribute('aria-hidden','false');$('personalEnglish').focus();}
function closeEditor(){$('editorModal').classList.remove('open');$('editorModal').setAttribute('aria-hidden','true');editId=null;}
function addEditorFromSearch(){openEditor(null,$('searchInput').value.trim());}
function editCurrent(){const card=scene().personal.find(c=>c.id===currentId);if(!card){toast('目前不是個人句子。先新增一句屬於你的句子。');return;}openEditor(card);}
function saveSentence(e){e.preventDefault();const word=$('personalEnglish').value.trim(),meaning=$('personalMeaning').value.trim();if(!word||!meaning){toast('請填寫英文句子和中文意思。');return;}const sc=scene();const current=sc.personal.find(c=>c.id===editId);
 const card={id:current?.id||`personal-${Date.now()}-${Math.random().toString(36).slice(2,9)}`,word,meaning,example:$('personalExample').value.trim(),translation:$('personalTranslation').value.trim(),note:$('personalNote').value.trim(),definition:'',phonetic:'',pos:'sentence',category:CUST,difficulty:'MY',collocations:[]};
 if(current)sc.personal[sc.personal.indexOf(current)]=card;else sc.personal.push(card);
 invalidate();currentId=card.id;activeScope='personal';$('deckScope').value='personal';searchTerm='';$('searchInput').value='';flipped=false;persist();closeEditor();render();toast(current?'個人句子已更新。':'句子已加入目前場合！');}
function deleteSentence(){const sc=scene();const card=sc.personal.find(c=>c.id===editId);if(!card)return;if(!confirm(`要刪除「${card.word.slice(0,60)}」嗎？`))return;sc.personal=sc.personal.filter(c=>c.id!==card.id);delete sc.progress[card.id];closeEditor();invalidate();currentId=null;persist();chooseRandom();toast('個人句子已刪除。');}
function downloadJson(obj,filename){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);}
function exportData(){const sc=scene(), safe=sc.name.replace(/[\\/:*?"<>|\x00-\x1f]/g,'-').slice(0,55)||'scene';const backup={app:'wordwell',version:2,exportedAt:new Date().toISOString(),scenario:{id:sc.id,name:sc.name,personal:sc.personal,progress:sc.progress,favorites:sc.favorites},cards:allCards(),progress:sc.progress,favorites:sc.favorites};
 downloadJson(backup,`wordwell-${safe}-${todayKey()}.json`);toast(`已匯出「${sc.name}」的詞庫、個人句子及學習進度。`);
}
function uniqueSceneName(name){let label=String(name||'匯入場合').slice(0,65),n=2;const names=new Set(data.scenes.map(s=>s.name));if(!names.has(label))return label;const base=label.slice(0,55);while(names.has(`${base} (${n})`))n++;return `${base} (${n})`;}
function importFileChange(e){const file=e.target.files?.[0];if(!file)return;
 if(file.size>30*1024*1024){toast('JSON 檔案太大（超過 30 MB）。');e.target.value='';return;}
 const reader=new FileReader();reader.onload=()=>{try{const imported=JSON.parse(String(reader.result));if(!imported||!Array.isArray(imported.cards))throw Error('沒有 cards 陣列');
  const incoming=imported.cards.map((c,i)=>normalizeCard(c,'自訂單字',`import-${Date.now()}-${i}`)).filter(Boolean);if(!incoming.length)throw Error('沒有有效英文卡片');
  const sceneInfo=imported.scenario&&typeof imported.scenario==='object'?imported.scenario:null;
  const name=uniqueSceneName(sceneInfo?.name||file.name.replace(/\.json$/i,'').replace(/^wordwell-/i,'').replace(/-\d{4}-\d{2}-\d{2}$/,''));
  if(!confirm(`匯入「${name}」成為新場合？\n現有場合不會被覆蓋；詞庫內的額外英文單字亦會合併。`))return;
  const sc=newScene(name);sc.progress=(sceneInfo?.progress&&typeof sceneInfo.progress==='object'?sceneInfo.progress:imported.progress&&typeof imported.progress==='object'?imported.progress:{});sc.favorites=Array.isArray(sceneInfo?.favorites)?sceneInfo.favorites:Array.isArray(imported.favorites)?imported.favorites:[];
  const addOwn=Array.isArray(sceneInfo?.personal)?sceneInfo.personal:incoming.filter(c=>!builtinIdMap.has(c.id)&&!c.id.startsWith('core-')&&(c.id.startsWith('custom-')||c.id.startsWith('personal-')||c.category===CUST||c.category==='自訂單字'||!c.id.startsWith('ext-')&&c.category!=='擴充詞庫'));
  const ownIds=new Set();sc.personal=addOwn.map((c,i)=>normalizeCard(c,CUST,`personal-import-${i}`)).filter(Boolean).map(c=>({...c,category:CUST})).filter(c=>{if(ownIds.has(c.id))return false;ownIds.add(c.id);return true;});
  // Migrate any built-in word that the user edited before exporting a backup.
  const overrideMap=new Map(data.overrides.map(c=>[c.id,c]));
  const editedKeys=['word','meaning','example','translation','note','definition','phonetic','pos','category','difficulty'];
  for(const c of incoming){const original=builtinIdMap.get(c.id);if(original&&editedKeys.some(k=>String(c[k]||'')!==String(original[k]||'')))overrideMap.set(c.id,c);}
  data.overrides=[...overrideMap.values()];
  const extraIds=new Set([...builtinIdMap.keys(),...data.extras.map(c=>c.id)]);const personalIds=new Set(sc.personal.map(c=>c.id));
  for(const c of incoming){if(builtinIdMap.has(c.id)||personalIds.has(c.id)||extraIds.has(c.id))continue;data.extras.push(c);extraIds.add(c.id);}
  data.scenes.push(sc);data.activeSceneId=sc.id;activeScope='all';$('deckScope').value='all';currentId=null;invalidate();persist();chooseRandom();toast(`已匯入「${name}」，包含 ${sc.personal.length} 句個人句子。`);
 }catch(err){toast(`匯入失敗：${err.message||'檔案格式不正確'}`);}finally{e.target.value='';}};
 reader.onerror=()=>{toast('無法讀取此 JSON 檔案。');e.target.value='';};reader.readAsText(file,'UTF-8');
}
async function expandDictionary(){const btn=$('expandDictBtn');btn.disabled=true;btn.textContent='⌛ 正在下載詞庫…';try{
 const response=await fetch('https://raw.githubusercontent.com/imfiiish/wordlists/main/data/en/definitions.json',{cache:'force-cache'});if(!response.ok)throw Error('network');const dict=await response.json();
 const knownWords=new Set([...builtin,...data.extras].map(c=>c.word.toLocaleLowerCase()));const knownIds=new Set([...builtin,...data.extras].map(c=>c.id));let added=0;
 const posMap={'vt.':'v.','vi.':'v.','v.':'v.','n.':'n.','a.':'adj.','adv.':'adv.','prep.':'prep.','pron.':'pron.','conj.':'conj.','num.':'num.','interj.':'interj.'};
 for(const [word,info] of Object.entries(dict)){
  if(word==='_meta'||!/^[A-Za-z][A-Za-z '-]{0,44}$/.test(word)||knownWords.has(word.toLocaleLowerCase())||!Array.isArray(info))continue;
  const senses=Array.isArray(info[1])?info[1]:[];const entries=senses.filter(item=>Array.isArray(item)&&Array.isArray(item[1])&&item[1].length&&/^(n\.|v\.|vt\.|vi\.|a\.|adv\.|prep\.|pron\.|conj\.|num\.|interj\.)$/.test(item[0]));if(!entries.length)continue;
  const first=entries[0],gloss=first[1].filter(v=>typeof v==='string').slice(0,2).join('；').trim().slice(0,130);if(!gloss)continue;
  const id=`ext-${word.toLocaleLowerCase().replace(/[^a-z0-9]+/g,'-')}`;if(knownIds.has(id))continue;
  data.extras.push({id,word,meaning:gloss,example:'',translation:'',definition:'',phonetic:info[0]?`/${String(info[0]).slice(0,75)}/`:'',pos:posMap[first[0]]||first[0],category:'擴充詞庫',difficulty:'字典',collocations:[],note:''});knownIds.add(id);knownWords.add(word.toLocaleLowerCase());added++;
 }
 invalidate();persist();chooseRandom();toast(added?`已新增 ${added.toLocaleString()} 個詞條，現在共 ${allCards().length.toLocaleString()} 張卡！`:'擴充詞條已全部在詞庫內。');
 }catch(e){toast('詞庫下載失敗。請確認網絡，離線預設詞庫仍可使用。');}
 finally{btn.disabled=false;btn.innerHTML='<span class="tile-icon">☁</span><span class="tile-txt">連網擴充至約 7,000 個詞條<small>需要網絡連線，部分詞條未附例句</small></span>';}
}
$('randomBtn').addEventListener('click',chooseRandom);
$('toolsTrigger').addEventListener('click',openTools);$('closeToolsBtn').addEventListener('click',closeTools);$('toolsBackdrop').addEventListener('click',closeTools);
$('closeUsage').addEventListener('click',closeUsage);$('doneUsage').addEventListener('click',closeUsage);$('usageModal').addEventListener('click',e=>{if(e.target===$('usageModal'))closeUsage();});
window.addEventListener('resize',()=>fitCardToContent());
$('searchInput').addEventListener('input',e=>findSearch(e.target.value));
$('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();findSearch(e.target.value);if(!current()&&e.target.value.trim())addEditorFromSearch();else $('searchInput').blur();}});
$('vocabCard').addEventListener('click',e=>{const action=e.target.closest('[data-action]');if(action){e.stopPropagation();switch(action.dataset.action){case 'speak':speak(current()?.word||'');break;case 'exampleSpeak':speak(current()?.example||current()?.word||'');break;case 'again':grade(false);break;case 'know':grade(true);break;case 'edit':editCurrent();break;case 'usage':openUsage();break;case 'add':addEditorFromSearch();break;}return;}flip();});
$('vocabCard').addEventListener('keydown',e=>{if(['Space',' '].includes(e.key)||e.key==='Enter'){if(e.target.closest('button'))return;e.preventDefault();flip();}});
$('sceneSelect').addEventListener('change',e=>changeScene(e.target.value));
$('createSceneBtn').addEventListener('click',createScene);$('sceneNameInput').addEventListener('keydown',e=>{if(e.key==='Enter')createScene();});$('deleteSceneBtn').addEventListener('click',deleteScene);
$('deckScope').addEventListener('change',e=>{activeScope=e.target.value;currentId=null;chooseRandom();});
$('addPersonalBtn').addEventListener('click',addEditorFromSearch);$('editPersonalBtn').addEventListener('click',editCurrent);
$('closeEditor').addEventListener('click',closeEditor);$('cancelEditor').addEventListener('click',closeEditor);$('personalForm').addEventListener('submit',saveSentence);$('deletePersonalBtn').addEventListener('click',deleteSentence);
$('editorModal').addEventListener('click',e=>{if(e.target===$('editorModal'))closeEditor();});
$('exportBtn').addEventListener('click',exportData);$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',importFileChange);$('expandDictBtn').addEventListener('click',expandDictionary);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('editorModal').classList.contains('open'))closeEditor();else if($('usageModal').classList.contains('open'))closeUsage();else if(!$('toolsPanel').hidden)closeTools();}if((e.key===' '||e.key==='ArrowRight')&&!e.target.closest('input,textarea,select,button,summary')&&!$('editorModal').classList.contains('open')&&!$('usageModal').classList.contains('open')&&$('toolsPanel').hidden&&e.target!==$('vocabCard')){e.preventDefault();if(e.key==='ArrowRight')chooseRandom();else flip();}});
initData();chooseRandom();
})();
</script>
</body>
</html>
